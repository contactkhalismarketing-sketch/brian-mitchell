<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:2560px;height:1440px;overflow:hidden}
  body{background:linear-gradient(120deg,#fdf8f0 0%,#f7efe5 55%,#efe3d3 100%);position:relative}
  .glow{position:absolute;right:-120px;top:-260px;width:1500px;height:1500px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,243,.9) 0%,rgba(255,250,243,0) 62%)}
  .arc{position:absolute;right:-260px;bottom:110px;width:1240px;height:620px;border:3px solid rgba(215,124,85,.6);border-bottom:0;border-radius:999px 999px 0 0}
  .card{position:absolute;background:#fffaf3;padding:14px;box-shadow:0 40px 90px rgba(39,89,78,.20),0 8px 24px rgba(39,89,78,.10)}
  .card img{display:block;width:100%;height:100%;object-fit:cover}
  .a{left:1150px;top:330px;width:740px;height:520px;transform:rotate(-3deg);z-index:1}
  .b{left:1760px;top:500px;width:660px;height:470px;transform:rotate(2.5deg);z-index:3}
  .c{left:1310px;top:720px;width:600px;height:410px;transform:rotate(-1.5deg);z-index:2}
  .a img{object-position:center 40%}
  .b img{object-position:center 55%}
  .c img{object-position:center 35%}
</style></head><body>
  <div class="glow"></div>
  <div class="arc"></div>
  <div class="card a"><img src="../src/assets/blog/bioclear-technique.jpg"></div>
  <div class="card b"><img src="../src/assets/blog/monitor-aligner-therapy.jpg"></div>
  <div class="card c"><img src="../src/assets/blog/planning-implant.jpg"></div>
</body></html>
